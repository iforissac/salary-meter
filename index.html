<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="跳錶">
<title>跳錶 Salary Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --well: #050505;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --text-sub: #8a8a8a;
    --accent: #00ff66;
    --accent-dim: #00cc52;
    --accent-glow: rgba(0, 255, 102, 0.15);
    --mono: 'Share Tech Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: transform 2s ease-in-out;
  }

  /* header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .title { font-size: 0.85rem; letter-spacing: 2px; color: var(--text-sub); margin-right: auto; }
  .chip {
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 3px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-sub);
  }
  button.chip { cursor: pointer; }
  button.chip:hover { color: var(--text); border-color: #444; }
  .focus-chip { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); box-shadow: 0 0 8px rgba(0, 255, 102, 0.45), inset 0 0 6px rgba(0, 255, 102, 0.15); text-shadow: 0 0 6px rgba(0, 255, 102, 0.6); animation: glow 2.4s ease-in-out infinite; }
  button.focus-chip:hover { color: #fff; border-color: var(--accent); box-shadow: 0 0 14px rgba(0, 255, 102, 0.7), inset 0 0 8px rgba(0, 255, 102, 0.25); }
  @keyframes glow { 50% { box-shadow: 0 0 14px rgba(0, 255, 102, 0.7), inset 0 0 8px rgba(0, 255, 102, 0.25); } }
  .chip.running { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

  /* salary input */
  .label { font-size: 0.72rem; color: var(--text-sub); letter-spacing: 1px; }
  .input-section { display: flex; align-items: center; gap: 10px; }
  .input-section .label { flex: none; }
  .input-section .input-row { flex: 1; min-width: 0; }
  /* 平時沒有框，像一行普通文字；滑過或輸入時才出現框 */
  .input-row { display: flex; border: 1px solid transparent; background: transparent; transition: border-color .2s, background .2s; }
  .input-row:hover { border-color: var(--border); }
  .input-row:has(.salary-input:focus), .input-row:has(.cur-select:focus) { border-color: var(--accent); background: var(--well); }
  .input-row .cur-select, .input-row .eye-btn { border-color: transparent; transition: border-color .2s, background-size .2s; }
  .input-row:hover .cur-select, .input-row:hover .eye-btn,
  .input-row:has(.salary-input:focus) .cur-select, .input-row:has(.salary-input:focus) .eye-btn,
  .input-row:has(.cur-select:focus) .cur-select, .input-row:has(.cur-select:focus) .eye-btn { border-color: var(--border); }
  .input-row:not(:hover):not(:has(:focus)) .cur-select { background-size: 0 0; padding-right: 6px; }
  .cur-select {
    appearance: none; -webkit-appearance: none;
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    color: var(--text-sub);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0 22px 0 10px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-sub) 50%), linear-gradient(135deg, var(--text-sub) 50%, transparent 50%);
    background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
  }
  .cur-select option { background: #111; color: var(--text); }
.salary-mask { display: none; flex: 1; text-align: left; padding: 6px 10px; color: var(--text-sub); font-size: 1rem; letter-spacing: 3px; align-self: center; }
  .eye-btn { flex: none; width: 38px; background: transparent; border: none; border-left: 1px solid var(--border); color: var(--text-sub); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .eye-btn:hover { color: var(--text); }
  .eye-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .eye-btn svg { width: 18px; height: 18px; }
  body.hide-pay .salary-input { display: none; }
  body.hide-pay .salary-mask { display: block; }
  .salary-input {
    flex: 1; min-width: 0;
    background: transparent;
    border: none;
    color: #fff;
    font-family: var(--mono);
    font-size: 1rem;
    padding: 6px 10px;
    outline: none;
    text-align: left;
    color: var(--text-sub);
    transition: color .2s;
  }
  .salary-input::-webkit-outer-spin-button, .salary-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .salary-input { -moz-appearance: textfield; appearance: textfield; }
  .salary-input:focus { color: #fff;
  }

  /* meter */
  .meter-box {
    background: var(--well);
    border: 1px solid var(--border);
    padding: 34px 14px 38px;
    text-align: center;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
.meter-box { position: relative; }
  .expand-btn { position: absolute; bottom: 8px; right: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-sub); cursor: pointer; opacity: 0.7; transition: opacity .2s, color .2s; }
  .expand-btn:hover { opacity: 1; color: var(--text); }
  .expand-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; opacity: 1; }
  .expand-btn svg { width: 26px; height: 26px; }
  .meter-hint { position: absolute; left: 12px; right: 56px; bottom: 20px; font-size: 0.8rem; color: var(--accent); opacity: 0; transform: translateY(4px); transition: opacity .5s, transform .5s; pointer-events: none; }
  .meter-hint.show { opacity: 0.9; transform: none; }
  .expand-btn.nudge { color: var(--accent); opacity: 1; animation: nudge 1s ease-in-out 3; }
  @keyframes nudge { 50% { transform: scale(1.25); } }
  body.display .expand-btn, body.display .meter-hint { display: none; }
  .meter-label { font-size: clamp(1.05rem, 4.4vw, 1.35rem); color: var(--text-sub); margin-bottom: 14px; letter-spacing: 0.5px; line-height: 1.35; }
  body.display .meter-label { font-size: clamp(1.15rem, 5vmin, 2.4rem); margin-bottom: 2.5vh; }
  .meter-main {
    display: inline-block;
    white-space: nowrap;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    font-size: 48px;
  }
  .meter-main .sym { font-size: 0.38em; color: var(--accent-dim); margin-right: 0.15em; vertical-align: 0.9em; }
  .meter-main .dec { font-size: 0.55em; opacity: 0.6; }

  .stats-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.78rem;
    color: var(--text-sub);
    border-top: 1px dashed var(--border);
    padding-top: 10px;
  }
  .stats-row b { color: var(--text); font-weight: normal; }

  /* ladder */
  .ladder {
    padding: 4px 0 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ladder-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .info-btn {
    background: none; border: 1px solid var(--border); color: var(--text-sub);
    width: 20px; height: 20px; border-radius: 50%;
    font-family: var(--mono); font-size: 0.7rem; cursor: pointer; flex: none;
  }
  .info-btn:hover { color: var(--text); }
  .next-text { font-size: 0.78rem; color: var(--text); cursor: pointer; user-select: none; -webkit-user-select: none; }
  .next-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .next-text .amt { color: var(--accent); }
  .track { position: relative; padding-top: 30px; margin-top: 2px; }
  .runner { position: absolute; bottom: 7px; left: 0; width: 30px; transform: translateX(-62%); transition: left 1s linear; pointer-events: none; }
  .runner img { display: block; width: 100%; height: auto; animation: bob 0.34s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes bob { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-3px) rotate(3deg); } }
  .bar-wrap { position: relative; }
  .bar { width: 100%; height: 6px; background: #1c1c1c; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 1s linear; }
  .tick { position: absolute; top: -2px; width: 2px; height: 10px; background: #3a3a3a; transform: translateX(-50%); }
  .tick.unlocked { background: var(--accent); }
  .markers { position: relative; height: 24px; margin-top: 4px; }
  .marker { position: absolute; top: 0; display: flex; gap: 3px; white-space: nowrap; }
  .marker .flag { font-size: 0.95rem; line-height: 1.15; opacity: 0.35; transition: opacity .4s; }
  .marker .flag.unlocked { opacity: 1; }

.month-earned { font-size: 0.72rem; color: var(--text-sub); }
  .month-earned .amt { color: var(--text); }
  body.display .month-earned { text-align: center; font-size: clamp(0.75rem, 2.2vmin, 1rem); }
  .sources { display: none; font-size: 0.68rem; color: var(--text-sub); line-height: 1.6; border-top: 1px dashed var(--border); padding-top: 8px; }
  .sources.open { display: block; }
  .sources li { list-style: none; }

  /* buttons */
  .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .btn {
    position: relative;
    overflow: hidden;
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .btn:hover { background: #262626; }
  .btn:focus-visible, .chip:focus-visible, .info-btn:focus-visible, .cur-select:focus-visible, .meter-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-start { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-start:hover { background: var(--accent-dim); }

  /* long-press reset: fill grows while held */
  .btn-reset .fill {
    position: absolute; inset: 0;
    background: #ff4d4d;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.25s ease-out;
    pointer-events: none;
  }
  .btn-reset .txt { position: relative; }
  .btn-reset.holding .fill { transform: scaleX(1); transition: transform 1.5s linear; }
  .btn-reset.holding .txt { color: #000; transition: color 1.2s linear 0.3s; }
  .btn-reset.done { border-color: var(--accent); }
  .btn-reset.done .fill { background: var(--accent); transform: scaleX(1); transition: none; }

  .footer { text-align: center; font-size: 0.68rem; color: var(--text-sub); }

  .hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    font-size: 0.75rem; color: var(--text-sub);
    opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  .hint.show { opacity: 1; }

  /* ---------- display mode: only the number ---------- */
  body.display { padding: 0; }
  body.display .container { max-width: none; width: 100vw; min-height: 100vh; border: none; background: var(--bg); justify-content: center; padding: 4vh 4vw; gap: 3vh; }
  body.display .header,
  body.display .input-section,
  body.display .btn-group,
  body.display .footer,
  body.display .markers,
  body.display .sources,
  body.display .info-btn { display: none; }
  body.display .meter-box { border: none; background: transparent; padding: 0; }
  body.display .stats-row { border-top: none; justify-content: center; gap: 28px; font-size: clamp(0.8rem, 2.4vmin, 1.1rem); }
  body.display .ladder { border: none; background: transparent; padding: 0; max-width: 720px; width: 100%; margin: 0 auto; }
  body.display .ladder-head { justify-content: center; }
  body.display .next-text { font-size: clamp(0.8rem, 2.4vmin, 1.1rem); color: var(--text-sub); }
  body.display .bar { height: 3px; }
  body.display .tick { height: 7px; top: -2px; }
  body.display .runner { width: clamp(26px, 6vmin, 44px); bottom: 4px; }

  /* ---------- 直立專注模式：數字分兩行，盡量放大 ---------- */
  body.display.portrait .container { gap: 4vh; }
  body.display.portrait .meter-main { display: inline-flex; flex-direction: column; align-items: center; line-height: 0.95; }
  body.display.portrait .meter-main .sym { font-size: 0.26em; vertical-align: 0; margin: 0 0 0.15em; }
  body.display.portrait .meter-main .dec { font-size: 0.42em; margin-top: 0.1em; }
  body.display.portrait .stats-row { flex-direction: column; align-items: center; gap: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .container, .bar-fill, .marker .flag, .hint, .runner, .meter-hint { transition: none; }
    .expand-btn.nudge, .focus-chip { animation: none; }
    .runner img { animation: none; }
    .btn-reset.holding .fill { transition: transform 1.5s linear; }
  }
</style>
</head>
<body>

<div class="container" id="container">
  <div class="header">
    <div class="title" data-i18n="title">跳錶</div>
    <button id="focusBtn" class="chip focus-chip" type="button">專注模式</button>
    <button id="langBtn" class="chip" type="button" aria-label="Language">繁</button>
    <div id="statusBadge" class="chip">已暫停</div>
  </div>

  <div class="input-section">
    <label class="label" for="salaryInput" data-i18n="salary">月薪</label>
    <div class="input-row">
      <select id="curSelect" class="cur-select" aria-label="Currency"></select>
      <input type="number" id="salaryInput" class="salary-input" inputmode="decimal" min="0" step="any">
      <span class="salary-mask" id="salaryMask" aria-hidden="true">*****</span>
      <button type="button" class="eye-btn" id="eyeBtn" aria-pressed="false"></button>
    </div>
  </div>

  <div class="meter-box" id="meterBox" tabindex="0" role="button" aria-label="Display mode">
    <button type="button" class="expand-btn" id="expandBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></button>
    <div class="meter-hint" id="meterHint" aria-live="polite"></div>
    <div class="meter-label" id="meterLabel"></div>
    <div id="meter" class="meter-main"><span class="sym" id="mSym">HK$</span><span id="mInt">0</span><span class="dec" id="mDec">.0000</span></div>
  </div>

  <div class="stats-row">
    <div><span data-i18n="perMin">每分鐘</span> <b id="perMin">0.00</b></div>
    <div><span data-i18n="perHour">每小時</span> <b id="perHour">0.00</b></div>
  </div>

  <div class="ladder">
    <div class="ladder-head">
      <div class="next-text" id="nextText" tabindex="0" role="button"></div>

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

  } catch (e) {}
  if (!FX[state.currency]) state.currency = 'HKD';
  if (!I18N[state.lang]) state.lang = 'zh-Hant';
  if (!(state.salaryUSD >= 0)) state.salaryUSD = 0;
  if (!(state.bankedUSD >= 0)) state.bankedUSD = 0;
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

const rateUSDperMs = () => state.salaryUSD / MS_PER_MONTH;
function totalUSD(now = Date.now()) {
  let t = state.bankedUSD;
  if (state.running && state.segStart) t += Math.max(0, now - state.segStart) * rateUSDperMs();
  return t;
}
// 把本段累積的金額存起來，重新開始一段（改月薪、暫停時用）
function bank() {
  const now = Date.now();
  state.bankedUSD = totalUSD(now);
  state.segStart = state.running ? now : null;
}

function monthBounds(now) {

// 進度條按日曆計算：本月過了幾多，就賺了月薪的幾多
// 各地放在「它的月薪 ÷ 你的月薪」的位置；超過你月薪的地方本月到不了
function buildMarkers(inside) {
  const t = T();
  ticksEl.innerHTML = ''; markersEl.innerHTML = '';
  // 太近的國旗併成一組，並排放在同一行，不會跌到下一行
  // 按實際寬度判斷：兩組國旗會碰到就合併
  const W = markersEl.clientWidth || 300, FLAG = 22 / W, GAP = 4 / W;
  const center = g => g.reduce((a, m) => a + m.pos, 0) / g.length;
  const groups = [];
  inside.forEach(m => {
    const tk = document.createElement('div');
    tk.className = 'tick'; tk.style.left = m.pos * 100 + '%';
    ticksEl.appendChild(tk);
    m.tk = tk;
    groups.push([m]);
    while (groups.length > 1) {
      const b = groups[groups.length - 1], a = groups[groups.length - 2];
      const aRight = center(a) + a.length * FLAG / 2, bLeft = center(b) - b.length * FLAG / 2;
      if (bLeft - aRight >= GAP) break;
      groups.splice(groups.length - 2, 2, a.concat(b));
    }
  });
  groups.forEach(g => {
    const c = center(g);
    const mk = document.createElement('div');
    mk.className = 'marker';
    mk.style.left = c * 100 + '%';
    mk.style.transform = 'translateX(-50%)';
    g.forEach(m => {
      const f = document.createElement('span');
      f.className = 'flag';
      f.textContent = m.flag;
      f.title = m.w[LI[state.lang]];
      f.setAttribute('aria-label', m.w[LI[state.lang]]);
      mk.appendChild(f);
      m.mk = f;
    });
    markersEl.appendChild(mk);
  });
  markersEl.style.height = inside.length ? '24px' : '0px';
}

// 按月薪挑選 6–7 個平均分布的站：太低（< 5%）或超過自己月薪的不放
const TARGETS = [0.12, 0.26, 0.40, 0.54, 0.68, 0.82, 0.95];
function pickStops(sal) {
  const cands = LADDER.map(m => Object.assign({}, m, { pos: m.usd / sal })).filter(m => m.pos >= 0.05 && m.pos <= 1);
  const picked = [];
  const ok = (m, ignore) => picked.every(p => p === ignore || Math.abs(p.pos - m.pos) >= 0.07);
  TARGETS.forEach(t => {
    let best = null;
    cands.forEach(m => {
      if (picked.includes(m) || !ok(m) || Math.abs(m.pos - t) > 0.08) return;
      if (!best || Math.abs(m.pos - t) < Math.abs(best.pos - t)) best = m;
    });
    if (best) picked.push(best);
  });
  // 家鄉標杆在範圍內就一定放上去，替換最接近的一個
  const home = cands.find(m => m.id === HOME[state.currency]);
  if (home && !picked.includes(home)) {
    const clash = picked.filter(p => Math.abs(p.pos - home.pos) < 0.07).sort((x, y) => Math.abs(x.pos - home.pos) - Math.abs(y.pos - home.pos))[0];
    if (clash) picked.splice(picked.indexOf(clash), 1);
    if (ok(home)) picked.push(home);
  }
  return picked.sort((x, y) => x.pos - y.pos);
}

let ladderInside = [];
function renderLadder() {
  const t = T(), li = LI[state.lang];
  const now = Date.now();
  const [s0, s1] = monthBounds(now);
  const len = s1 - s0, f = (now - s0) / len;
  barFill.style.width = runner.style.left = (f * 100).toFixed(3) + '%';

  const sal = state.salaryUSD;
  const m$ = fmtMoney(sal * f, 2);
  monthEarned.innerHTML = sal > 0 ? t.month(SYM[state.currency] + (state.hidePay ? MASK : m$.int + m$.dec)) : '';

  const key = state.lang + '|' + state.currency + '|' + sal.toFixed(6);
  if (key !== ladderKey) {
    ladderKey = key;
    ladderInside = sal > 0 ? pickStops(sal) : [];
    buildMarkers(ladderInside);
  }
  if (!(sal > 0)) { nextText.textContent = t.noSalary; return; }

  ladderInside.forEach(m => {
    const on = f >= m.pos;
    m.tk.classList.toggle('unlocked', on);
    m.mk.classList.toggle('unlocked', on);
  });

  nextText.innerHTML = currentLine(() => {
    const next = ladderInside.find(m => m.pos > f);
    if (next) {
      return t.nextIn(fmtDur((next.pos - f) * len), next.flag, next.w[li]);
    } else if (ladderInside.length) {
      const last = ladderInside[ladderInside.length - 1];
      if (!LADDER.some(m => m.usd > sal)) {
        return t.multiple((sal / last.usd).toFixed(1), last.flag, last.w[li]);
      } else {
        const day = new Date(s0 + last.pos * len).getDate();
        return t.reached(day, last.flag, last.w[li]);
      }
    } else {
      const m = LADDER[0];
      return t.below(m.flag, m.w[li], Math.round(sal / m.usd * 100));
    }
    return '';
  });
}

function lineCtx() {
  const now = Date.now(), d = new Date(now);
  const [s0, s1] = monthBounds(now);
  const len = s1 - s0, fx_ = fx();
  const salC = state.salaryUSD * fx_;
  const perMsC = rateUSDperMs() * fx_;
  const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const dow = d.getDay();
  const monday = midnight - ((dow + 6) % 7) * 24 * H;
  const bk = BASKETS[BASKET_FOR[state.currency]];
  const items = bk ? bk.items.map(it => Object.assign({}, it, { pc: it.p / FX[bk.cur] * fx_ })) : null;
  return {
    now, s0, len, f: (now - s0) / len, salC, perMsC, monthRate: salC / len,
    monthC: salC * (now - s0) / len, todayC: perMsC * (now - midnight), weekC: perMsC * (now - monday),
    sessionC: totalUSD(now) * fx_, hour: d.getHours(), dow, day: d.getDate(),
    weekday: dow >= 1 && dow <= 5, items, hide: state.hidePay, L: LK[state.lang] || 'hk'
  };
}

function pickItem(c, amount, rnd) {
  if (!c.items || !(amount > 0)) return null;
  const fit = c.items.filter(it => { const n = amount / it.pc; return n >= 1 && n <= 999; });
  if (!fit.length) return null;
  const nice = fit.filter(it => { const n = amount / it.pc; return n >= 2 && n <= 200; });
  const pool = nice.length ? nice : fit;
  return pool[Math.floor(rnd() * pool.length)];
}

    say: S((c, p) => `今晚瞓 8 個鐘，起身已經賺夠 ${num(c.perMsC * 8 * H / p.it.pc)} ${p.it.many.hk}`,
           (c, p) => `今晚睡 8 小時，醒來已經賺到 ${num(c.perMsC * 8 * H / p.it.pc)} ${p.it.many.tw}`,
           (c, p) => `今晚睡 8 小时，醒来已经赚够 ${num(c.perMsC * 8 * H / p.it.pc)} ${p.it.many.cn}`,
           (c, p) => `Sleep 8 hours and wake up ${num(c.perMsC * 8 * H / p.it.pc)} ${p.it.many.en} richer`) },
  { id: 'nt_calm', cat: 'night', when: c => c.hour >= 23 || c.hour < 7,
    say: S(() => '夜喇，錢照入袋，安心瞓啦',
           () => '很晚了，錢照樣入袋，安心睡吧',
           () => '夜深了，钱照样到账，安心睡吧',
           () => 'It\'s late. The money keeps coming. Go to sleep') },

  /* ---------- 午飯（平日 12–14 點） ---------- */
  { id: 'lu_amt', cat: 'lunch', leak: true, when: c => c.weekday && c.hour >= 12 && c.hour < 14,
    say: S(c => `食個 1 個鐘嘅午飯，都袋咗 ${amt(c.perMsC * H)}`,
           c => `吃個 1 小時的午餐，也入袋 ${amt(c.perMsC * H)}`,
           c => `吃个 1 小时的午饭，也到账 ${amt(c.perMsC * H)}`,
           c => `A one-hour lunch still pays you ${amt(c.perMsC * H)}`) },
  { id: 'lu_item', cat: 'lunch', basket: true, when: c => c.weekday && c.hour >= 12 && c.hour < 14,
    choose: (c, r) => { const it = pickItem(c, c.perMsC * H, r); return it && { it }; },
    say: S((c, p) => `食個午飯嘅時間，已經賺返 ${num(c.perMsC * H / p.it.pc)} ${p.it.many.hk}`,
           (c, p) => `吃個午餐的時間，已經賺回 ${num(c.perMsC * H / p.it.pc)} ${p.it.many.tw}`,
           (c, p) => `吃个午饭的工夫，已经赚回 ${num(c.perMsC * H / p.it.pc)} ${p.it.many.cn}`,
           (c, p) => `Your lunch hour earns back ${num(c.perMsC * H / p.it.pc)} ${p.it.many.en}`) },

  /* ---------- 星期 ---------- */
  { id: 'wk_fri', cat: 'week', leak: true, when: c => c.dow === 5 && c.hour >= 17,
    say: S(c => `星期五喇！今個星期已經袋咗 ${amt(c.weekC)}`,
           c => `星期五了！這週已經入袋 ${amt(c.weekC)}`,
           c => `周五啦！这周已经到账 ${amt(c.weekC)}`,
           c => `It's Friday! This week you've pocketed ${amt(c.weekC)}`) },
  { id: 'wk_end', cat: 'week', leak: true, when: c => c.dow === 0 || c.dow === 6,
    say: S(c => `週末乜都唔做，今日都袋咗 ${amt(c.todayC)}`,
           c => `週末什麼都不做，今天也入袋 ${amt(c.todayC)}`,
           c => `周末啥也不干，今天也到账 ${amt(c.todayC)}`,
           c => `Doing nothing this weekend, still pocketed ${amt(c.todayC)} today`) },
  { id: 'wk_endcalm', cat: 'week', when: c => c.dow === 0 || c.dow === 6,
    say: S(() => '放假都照計錢，好好休息',
           () => '放假也照樣算錢，好好休息',
           () => '放假也照样算钱，好好休息',
           () => 'Days off still count. Rest well') },
  { id: 'wk_mon', cat: 'week', when: c => c.dow === 1 && c.hour < 12,
    say: S(() => '新一個星期，錢已經開始入袋',
           () => '新的一週，錢已經開始入袋',
           () => '新的一周，钱已经开始到账',
           () => 'New week. The money has already started rolling in') }
];

const BASE_CATS = ['ladder', 'price', 'reverse', 'progress', 'slack'];
const WIN_CATS = ['night', 'lunch', 'week'];
let lineShift = 0, lineCache = null;

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function tplOk(t, c) {
  if (t.leak && c.hide) return false;
  if (t.basket && !c.items) return false;
  if (t.when && !t.when(c)) return false;
  return true;
}
function chooseLine(slot, c) {
  const probe = rng(1);
  const avail = cat => cat === 'ladder' || TPL.some(t => t.cat === cat && tplOk(t, c) && (!t.choose || t.choose(c, probe)));
  const base = BASE_CATS.filter(avail), win = WIN_CATS.filter(avail);
  const cat = (win.length && slot % 3 === 0) ? win[Math.floor(slot / 3) % win.length] : base[slot % base.length];
  if (cat === 'ladder') return { cat };
  const r = rng(hashStr(slot + cat));
  const pool = TPL.filter(t => t.cat === cat && tplOk(t, c)).sort(() => r() - 0.5);
  for (const t of pool) {
    const pick = t.choose ? t.choose(c, r) : {};
    if (pick) return { cat, t, pick };
  }
  return { cat: 'ladder' };
}
function currentLine(ladderHtml) {
  if (!(state.salaryUSD > 0)) return T().noSalary;
  const c = lineCtx();
  const slot = Math.floor((c.now - new Date(c.now).getTimezoneOffset() * 60000) / H) + lineShift;
  const key = [slot, state.currency, state.salaryUSD.toFixed(6), c.hide, state.running].join('|');
  if (!lineCache || lineCache.key !== key) lineCache = Object.assign({ key }, chooseLine(slot, c));
  if (!lineCache.t) return ladderHtml();
  const out = lineCache.t.say[c.L](c, lineCache.pick);
  return out || ladderHtml();
}
nextText.addEventListener('click', () => { lineShift++; lineCache = null; renderLadder(); });
nextText.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lineShift++; lineCache = null; renderLadder(); } });

/* ================= 主迴圈（約每秒 30 次） ================= */
let lastFrame = 0;
function loop(ts) {
  if (state.running && ts - lastFrame >= FRAME_MS) {
    lastFrame = ts;
    renderMeter(false);
  }
  requestAnimationFrame(loop);
}

/* ================= 螢幕常亮 ================= */
let wakeLock = null;
async function requestWake() {
  if (!state.running || document.visibilityState !== 'visible' || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
function releaseWake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }

/* ================= 隱藏月薪 ================= */
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.6 17.6 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const eyeBtn = $('eyeBtn');
const MASK = '****';
function renderHide() {
  const t = T(), h = state.hidePay;
  document.body.classList.toggle('hide-pay', h);
  eyeBtn.innerHTML = h ? EYE_OFF : EYE;
  eyeBtn.setAttribute('aria-pressed', h);
  eyeBtn.setAttribute('aria-label', h ? t.show : t.hide);
  eyeBtn.title = h ? t.show : t.hide;
  renderRates(); renderLadder();
}
eyeBtn.addEventListener('click', () => { state.hidePay = !state.hidePay; save(); renderHide(); });

/* ================= 事件 ================= */
salaryInput.addEventListener('input', () => {
  const v = Number(salaryInput.value);
  bank();
  state.salaryUSD = v > 0 ? v / fx() : 0;
  save(); renderRates(); renderLadder();
});

curSelect.addEventListener('change', () => {
  state.currency = curSelect.value;
  save(); syncInput(); renderStatic();
});

langBtn.addEventListener('click', () => {
  state.lang = LANGS[(LANGS.indexOf(state.lang) + 1) % LANGS.length];
  save(); renderStatic();
});

function setRunning(on) {
  bank();
  state.running = on;
  state.segStart = on ? Date.now() : null;
  save(); renderStatus(); renderMeter(true);
  on ? requestWake() : releaseWake();
}
startBtn.addEventListener('click', () => {
  setRunning(!state.running);
  if (state.running) maybeHint();
});
$('expandBtn').addEventListener('click', e => { e.stopPropagation(); setDisplay(true); });
$('focusBtn').addEventListener('click', e => { e.stopPropagation(); setDisplay(true); });

// 頭兩次按「開始」時提示一次可以全屏
let hintTimers = [];
function maybeHint() {
  if (state.hintCount >= 2 || document.body.classList.contains('display')) return;
  state.hintCount++; save();
  const h = $('meterHint'), b = $('expandBtn');
  hintTimers.forEach(clearTimeout);
  hintTimers = [
    setTimeout(() => { h.textContent = T().hintFocus; h.classList.add('show'); b.classList.add('nudge'); }, 1000),
    setTimeout(() => { h.classList.remove('show'); b.classList.remove('nudge'); }, 4500)
  ];
}

infoBtn.addEventListener('click', () => {
  const open = sourcesEl.classList.toggle('open');
  infoBtn.setAttribute('aria-expanded', open);
});

// 長按歸零：按住 1.5 秒，顏色填滿即歸零
let holdTimer = null;
function holdStart(e) {
  if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
  if (e.repeat || holdTimer) return;
  e.preventDefault();
  resetBtn.classList.remove('done');
  resetBtn.classList.add('holding');
  holdTimer = setTimeout(() => {
    holdTimer = null;
    state.bankedUSD = 0;
    state.segStart = state.running ? Date.now() : null;
    save(); lastLen = -1; renderMeter(true); renderStatus();
    resetBtn.classList.remove('holding');
    resetBtn.classList.add('done');
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (err) {}
    setTimeout(() => resetBtn.classList.remove('done'), 500);
  }, 1500);
}
function holdEnd() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  resetBtn.classList.remove('holding');
}
resetBtn.addEventListener('pointerdown', holdStart);
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => resetBtn.addEventListener(ev, holdEnd));
resetBtn.addEventListener('keydown', holdStart);
resetBtn.addEventListener('keyup', holdEnd);
resetBtn.addEventListener('contextmenu', e => e.preventDefault());

// 展示模式：按數字進入，按任何位置返回
let hintTimer = null;
function setDisplay(on, quiet) {
  document.body.classList.toggle('display', on);
  if (on && !quiet) {
    hint.textContent = T().exit;
    hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.remove('show'), 2200);
    const de = document.documentElement;
    if (de.requestFullscreen && !document.fullscreenElement) de.requestFullscreen().catch(() => {});
  }
  if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  container.style.transform = '';
  lastLen = -1; renderMeter(true);
}
meterBox.addEventListener('click', e => {
  if (!document.body.classList.contains('display')) { e.stopPropagation(); setDisplay(true); }
});
meterBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setDisplay(!document.body.classList.contains('display')); }
});
document.addEventListener('click', () => {
  if (document.body.classList.contains('display')) setDisplay(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('display')) setDisplay(false);
});

// 手機橫放（矮屏幕）自動進入展示模式
const landscape = window.matchMedia('(orientation: landscape) and (max-height: 520px)');
function onOrient() { setDisplay(landscape.matches, true); }
landscape.addEventListener ? landscape.addEventListener('change', onOrient) : landscape.addListener(onOrient);

// 防烙印：每分鐘輕微移動幾個像素
setInterval(() => {
  if (!state.running) return;
  const r = document.body.classList.contains('display') ? 8 : 3;
  const dx = Math.round((Math.random() * 2 - 1) * r), dy = Math.round((Math.random() * 2 - 1) * r);
  container.style.transform = `translate(${dx}px, ${dy}px)`;
}, 60000);

window.addEventListener('resize', () => { lastLen = -1; renderMeter(true); ladderKey = ''; renderLadder(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { renderMeter(true); requestWake(); }
  else save();
});
window.addEventListener('pagehide', save);
setInterval(() => { if (state.running) save(); }, 5000);
setInterval(renderLadder, 1000);

/* ================= 啟動 ================= */
load();

// 網址參數（自己架設檔案時用）：?salary=20000&cur=HKD&lang=en&auto=1&display=1
// 在 Claude 網頁上只能用 #display：一打開就自動開始並只顯示數字
const params = new URLSearchParams(location.search);
if (params.get('cur') && FX[params.get('cur').toUpperCase()]) state.currency = params.get('cur').toUpperCase();
if (params.get('lang') && I18N[params.get('lang')]) state.lang = params.get('lang');
if (params.get('salary') && Number(params.get('salary')) > 0) state.salaryUSD = Number(params.get('salary')) / fx();
const hashDisplay = location.hash === '#display';
const autoStart = params.get('auto') === '1' || hashDisplay;

syncInput();
renderStatic();
if (autoStart && !state.running) setRunning(true);
if (state.running) requestWake();
if (hashDisplay || params.get('display') === '1' || landscape.matches) setDisplay(true, true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastLen = -1; renderMeter(true); });
requestAnimationFrame(loop);
</script>
